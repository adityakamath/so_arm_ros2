# Loaded by so_arm_control's control.launch.py when ros2_control_hardware_type:=mujoco, for
# both so100 and so101. Package: mujoco_ros2_plugins (github.com/adityakamath/mujoco_ros2_plugins,
# not vendored here - build it alongside like sts_hardware_interface, see the top-level README).
#
# EmergencyStopPlugin's service name defaults to "emergency_stop", the same relative name
# bool_toggle_node already targets for real hardware (so_arm_control/config/teleop.yaml) - no
# separate wiring needed for the joystick/GUI toggle to reach it in mujoco mode too.
#
# EmergencyStopPlugin disables actuation for every actuator while tripped (MuJoCo's whole-model
# mjDSBL_ACTUATION flag) - the same as sts_hardware_interface's real /emergency_stop and this
# package's own standalone tools (so_arm_mujoco/keyboard.py's EStop): torque is cut, so the arm
# falls under gravity (and its own passive damping/frictionloss) rather than holding.
/**:
  ros__parameters:
    mujoco_plugins:
      emergency_stop_plugin:
        type: "mujoco_ros2_plugins/EmergencyStopPlugin"
