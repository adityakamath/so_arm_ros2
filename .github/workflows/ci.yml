name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .

  test:
    name: pytest (ros:${{ matrix.ros_distro }})
    # rclpy and the ROS message packages the test suite needs aren't on PyPI, so this
    # runs inside a ROS image instead of alongside the pip-only lint job above.
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [kilted, jazzy]
    runs-on: ubuntu-latest
    container: ros:${{ matrix.ros_distro }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: src/so_arm_ros2

      - name: Install ROS dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            python3-pip python3-yaml python3-numpy python3-opencv git libfcl-dev \
            ros-${{ matrix.ros_distro }}-ament-index-python \
            ros-${{ matrix.ros_distro }}-control-msgs \
            ros-${{ matrix.ros_distro }}-controller-manager \
            ros-${{ matrix.ros_distro }}-controller-manager-msgs \
            ros-${{ matrix.ros_distro }}-cv-bridge \
            ros-${{ matrix.ros_distro }}-diagnostic-msgs \
            ros-${{ matrix.ros_distro }}-effort-controllers \
            ros-${{ matrix.ros_distro }}-hardware-interface \
            ros-${{ matrix.ros_distro }}-joint-state-broadcaster \
            ros-${{ matrix.ros_distro }}-joint-trajectory-controller \
            ros-${{ matrix.ros_distro }}-joy \
            ros-${{ matrix.ros_distro }}-joy-teleop \
            ros-${{ matrix.ros_distro }}-launch-testing \
            ros-${{ matrix.ros_distro }}-launch-testing-ros \
            ros-${{ matrix.ros_distro }}-parallel-gripper-controller \
            ros-${{ matrix.ros_distro }}-pinocchio \
            ros-${{ matrix.ros_distro }}-pluginlib \
            ros-${{ matrix.ros_distro }}-rclcpp-lifecycle \
            ros-${{ matrix.ros_distro }}-robot-state-publisher \
            ros-${{ matrix.ros_distro }}-ros2-control \
            ros-${{ matrix.ros_distro }}-ros2-controllers \
            ros-${{ matrix.ros_distro }}-rosidl-default-generators \
            ros-${{ matrix.ros_distro }}-std-srvs \
            ros-${{ matrix.ros_distro }}-tf2-ros \
            ros-${{ matrix.ros_distro }}-xacro
          pip install --break-system-packages --ignore-installed \
            -r src/so_arm_ros2/requirements-dev.txt
          # --user, not a plain system install: kinematics.py strips any sys.path entry
          # containing '/.local/lib/' before importing pinocchio (needs the numpy 1.x ABI
          # from the ros2-pinocchio apt install above, not a newer pip-installed one).
          # python-fcl/numpy-stl pull in their own numpy as a transitive dependency; without
          # --user that lands in /usr/local/lib (not matched by the filter) and shadows the
          # correct one, crashing pinocchio's import with a numpy ABI mismatch.
          pip install --break-system-packages --user --ignore-installed \
            -r src/so_arm_ros2/so_arm_control/requirements.txt

      - name: colcon build
        # sts_hardware_interface is built here (not ignored): test_control_launch.py runs with
        # use_mock:=true, which loads the real STS hardware plugin with servo I/O faked
        # internally, so the plugin itself has to exist. Its own dependencies (hardware_interface,
        # pluginlib, rclcpp_lifecycle, std_srvs, diagnostic_msgs, rosidl_default_generators) are
        # installed above.
        # mujoco_ros2_control is skipped: so_arm_description's xacro tests only check that
        # ros2_control_hardware_type:=mujoco emits the right <plugin> text, they don't load it.
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon build --packages-select so_arm_control so_arm_bringup so_arm_description sts_hardware_interface

      - name: pytest (so_arm_control)
        # One pytest invocation PER FILE, not one for the whole directory: pinocchio
        # (kinematics.py, most of the suite) and python-fcl (self_collision_checker.py) need
        # incompatible numpy ABIs and can't both be imported in the same process, and which
        # ROS message package a given test file imports first (e.g. sensor_msgs pulling in
        # numpy before a pinocchio-dependent file gets a chance) is enough on its own to
        # trigger the same conflict even between files that don't touch fcl at all - see
        # so_arm_control/test/conftest.py's note. Every file passes on its own; only a
        # combined run is unreliable.
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          . install/setup.sh
          cd src/so_arm_ros2/so_arm_control/test
          FAILED=0
          for f in test_*.py; do
            echo "::group::pytest $f"
            pytest "$f" || FAILED=1
            echo "::endgroup::"
          done
          exit $FAILED

      - name: pytest (so_arm_bringup)
        # Same numpy ABI conflict class as so_arm_control's step - one pytest invocation PER
        # FILE, so cv2 (test_opencv_camera_node.py) can't contaminate the others. See conftest.py.
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          . install/setup.sh
          cd src/so_arm_ros2/so_arm_bringup/test
          FAILED=0
          for f in test_*.py; do
            echo "::group::pytest $f"
            pytest "$f" || FAILED=1
            echo "::endgroup::"
          done
          exit $FAILED

      - name: pytest (so_arm_description)
        # No pinocchio/fcl here, so unlike so_arm_control this is a single ordinary pytest run.
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          . install/setup.sh
          cd src/so_arm_ros2/so_arm_description/test
          pytest test_urdf_xacro.py
