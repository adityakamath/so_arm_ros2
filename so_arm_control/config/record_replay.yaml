record_replay_node:
  ros__parameters:
    recordings_dir: /home/ubuntu/ros2_ws/src/so_arm_ros2/recordings  # gitignored, see so_arm_ros2/.gitignore
    joint_states_topic: /joint_states
    dynamic_joint_states_topic: /dynamic_joint_states
    estop_service: /emergency_stop
    output_topic: /joint_commands_replay  # joint_state_switch_node's 'replay' input (teleop.yaml)
    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_flex_joint
      - wrist_flex_joint
      - wrist_roll_joint
    publish_rate: 50.0  # matches controller_manager's update_rate (control.yaml)
    replay_gripper: true  # also overridable via control.launch.py's replay_gripper launch arg
    gripper_joint: gripper_joint
    gripper_action_name: gripper_controller/gripper_cmd
