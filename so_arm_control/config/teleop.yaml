joy_teleop:
  ros__parameters:
    teleop:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: /target_teleop
      deadman_buttons: [9]  # L1
      axis_mappings:
        twist-linear-x:
          axis: 1  # Left stick vertical
          scale: 0.25
          offset: 0.0
        twist-linear-y:
          axis: 0  # Left stick horizontal
          scale: 0.25
          offset: 0.0
        twist-linear-z:
          axis: 3  # Right stick vertical
          scale: 0.2
          offset: 0.0
        twist-angular-x:
          axis: 2  # Right stick horizontal - drives wrist roll
          scale: 1.0
          offset: 0.0
        header-frame_id:
          value: 'base_footprint'  # verified URDF root, not base_link

    # Raw -1..1 passthrough - gripper_teleop_node remaps per-model, and also picks up gripper
    # position from /joint_commands when GUI sliders are the active joint_state_switch input.
    gripper_teleop:
      type: topic
      interface_type: std_msgs/msg/Float64
      topic_name: /gripper_teleop
      deadman_buttons: [9]  # L1, same deadman as Cartesian teleop
      axis_mappings:
        data:
          axis: 5
          scale: 0.75
          offset: 0.0

    # Fires bool_toggle_node's Trigger services below.
    estop_toggle:
      type: service
      interface_type: std_srvs/srv/Trigger
      service_name: /emergency_stop_toggle
      buttons: [1]  # B

    joint_state_switch_toggle:
      type: service
      interface_type: std_srvs/srv/Trigger
      service_name: /joint_state_switch_toggle
      buttons: [2]  # X

    # waypoint_follow_node's services
    record_waypoint:
      type: service
      interface_type: std_srvs/srv/SetBool
      service_name: /record_waypoint
      service_request:
        data: true
      buttons: [3]  # Y

    waypoint_follow_toggle:
      type: service
      interface_type: std_srvs/srv/Trigger
      service_name: /waypoint_follow_toggle
      buttons: [0]  # A

    reset_waypoints:
      type: service
      interface_type: std_srvs/srv/SetBool
      service_name: /reset_waypoints
      service_request:
        data: true
      buttons: [11]  # settings

bool_toggle_node:
  ros__parameters:
    toggles: ["emergency_stop", "joint_state_switch", "waypoint_follow"]
    emergency_stop:
      trigger_service: /emergency_stop_toggle
      target_service: /emergency_stop
      initial_state: false
    joint_state_switch:
      trigger_service: /joint_state_switch_toggle
      target_service: /joint_state_switch
      initial_state: false
    waypoint_follow:
      trigger_service: /waypoint_follow_toggle
      target_service: /waypoint_follow
      initial_state: false

joint_state_switch_node:
  ros__parameters:
    output_topic: /joint_commands  # joint_trajectory_bridge's input
    # priority order, first = highest; ik is the fallback. replay is highest so it locks out
    # teleop while active - pausing/finishing/e-stop all flip /replay false, handing control back.
    inputs: ["replay", "patrol", "gui", "ik"]
    replay.topic: /joint_commands_replay
    replay.observe_service: /replay  # owned by record_replay_node, in control.launch.py
    patrol.topic: /joint_commands_patrol
    patrol.observe_service: /waypoint_follow  # mirrors waypoint_follow_node's own service
    gui.topic: /joint_commands_gui
    gui.own_service: /joint_state_switch
    ik.topic: /joint_commands_ik

waypoint_follow_node:
  ros__parameters:
    output_topic: /joint_commands_patrol  # joint_state_switch_node's 'patrol' input
    marker_topic: /waypoint_markers
    frame_id: base_footprint
    end_effector_link: end_effector_link  # same name on both so100 and so101
    number_of_loops: 0  # 0 = loop forever, N>0 = exactly N total passes
    max_acceleration: 40.0  # rad/s^2 - independently tunable from ik_teleop_node's own cap
    dwell_time: 1.0  # seconds - pause at each waypoint before advancing to the next leg

gripper_teleop_node:
  ros__parameters:
    # rad per unit of normalized load - compliant setpoint-shaping, disabled by default. Tune
    # empirically (sign included) starting from 0 if enabling - see README's Gripper Compliance.
    effort_gain: 0.0

ik_teleop_node:
  ros__parameters:
    twist_topic: /target_teleop  # joy_teleop's own output, see "teleop" above
    output_topic: /joint_commands_ik  # joint_state_switch_node's default input
    end_effector_link: end_effector_link  # same name on both so100 and so101
    # roll, pitch, yaw (rad) - roll is just the starting value, driven live by twist-angular-x.
    default_orientation: [0.0, 0.0, 0.0]
    publish_rate: 50.0  # matches controller_manager's update_rate (control.yaml)
    max_acceleration: 400.0  # rad/s^2 - caps velocity change tick to tick, see _kinematic_limit
    # meters - caps ik_target distance from base; 0 disables.
    max_target_reach: 0.45
