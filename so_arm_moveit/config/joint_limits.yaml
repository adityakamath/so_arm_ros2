# The URDF sets velocity="1e6" on every joint (see so101.urdf.xacro), so MoveIt needs real
# limits here or time parameterization produces near-instant trajectories.
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3

joint_limits:
  shoulder_pan_joint: &arm_joint
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  shoulder_lift_joint: *arm_joint
  elbow_flex_joint: *arm_joint
  wrist_flex_joint: *arm_joint
  wrist_roll_joint: *arm_joint
  gripper_joint: *arm_joint
