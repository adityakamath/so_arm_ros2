# MoveIt executes through the controllers of so_arm_control's `moveit` controller mode
# (config/controller_modes.yaml in so_arm_control): an arm-only trajectory controller plus the
# gripper action controller. They are only active in that mode - move_group.launch.py puts a
# running control stack into it and restores teleop mode on exit.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_trajectory_controller
    - gripper_controller

  arm_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_flex_joint
      - wrist_flex_joint
      - wrist_roll_joint

  gripper_controller:
    type: ParallelGripperCommand
    action_ns: gripper_cmd
    default: true
    joints:
      - gripper_joint

trajectory_execution:
  allowed_execution_duration_scaling: 2.5
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.05
  execution_duration_monitoring: true

moveit_manage_controllers: false
